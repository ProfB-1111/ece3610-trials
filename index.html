<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECE 3610 · Final Course Trials</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/common.css?v=202611241829">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto auto; min-height: 100vh; overflow: hidden; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: rgba(7,9,13,.85); }
  .top-right { display: flex; align-items: center; gap: 12px; }
  html[lang=ko] body { word-break: keep-all; }
  html[lang=ko] .upper, html[lang=ko] .sec-head h2, html[lang=ko] .tag, html[lang=ko] .pod .ec { letter-spacing: .04em; }
  .lang-btn { font-weight: 600; }
  .clock { font: 500 1.05rem var(--mono); color: var(--muted); min-width: 92px; text-align: right; }

  /* ---------- layout ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 20px; padding: 20px 28px; min-height: 0; }
  .board { display: flex; flex-direction: column; min-height: 0; padding: 20px 20px 10px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .sec-head h2 { margin: 0; font: 700 1.25rem var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .sec-head .note { font-size: .8rem; color: var(--muted); }
  .sec-head .note b { color: var(--gold); font-weight: 600; }

  /* ---------- podium ---------- */
  .podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 14px; align-items: end; margin-bottom: 18px; }
  .pod {
    --c: var(--silver); position: relative; border-radius: 12px; padding: 14px; cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 13%, transparent), rgba(255,255,255,.015));
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    display: flex; flex-direction: column; gap: 10px; transition: transform .2s;
  }
  .pod:hover { transform: translateY(-2px); }
  .pod.r1 { --c: var(--gold); padding-top: 22px; box-shadow: 0 0 40px -12px color-mix(in srgb, var(--gold) 60%, transparent); }
  .pod.r3 { --c: var(--bronze); }
  .pod.empty { opacity: .45; cursor: default; }
  .pod .medal { position: absolute; top: -12px; left: 14px; font: 700 .8rem var(--mono); color: #0b0d10; background: var(--c); padding: 3px 9px; border-radius: 6px; }
  .pod .ec { position: absolute; top: 12px; right: 12px; font: 700 .62rem var(--body); letter-spacing: .14em; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); padding: 3px 7px; border-radius: 5px; }
  .pod .ph { aspect-ratio: 4/3; border-radius: 9px; font-size: 1.8rem; border: 1px solid rgba(255,255,255,.06); }
  .pod .nm { font: 700 1.05rem var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .rb { font-size: .78rem; color: var(--muted); margin-top: -8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .tm { font: 700 1.6rem var(--mono); color: var(--c); line-height: 1; }
  .pod.r1 .tm { font-size: 1.95rem; }
  .pod .sub { display: flex; justify-content: space-between; font: 500 .75rem var(--mono); color: var(--muted); }

  /* ---------- table ---------- */
  .thead, .row { display: grid; grid-template-columns: 46px 44px minmax(0, 1fr) 110px 96px 96px; gap: 12px; align-items: center; padding: 0 12px; }
  .thead { font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .thead .r, .row .r { text-align: right; }
  .rows { overflow-y: auto; min-height: 0; flex: 1; padding-top: 6px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .row { height: 54px; border-radius: 10px; cursor: pointer; position: relative; transition: background .2s; }
  .row:hover { background: rgba(255,255,255,.03); }
  .row + .row { margin-top: 2px; }
  .row .rk { font: 700 1rem var(--mono); color: var(--muted); }
  .row .av { width: 38px; height: 38px; border-radius: 8px; font-size: .8rem; }
  .row .nm { font: 600 1rem var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm small { display: block; font: 400 .74rem var(--body); color: var(--muted); }
  .row .bt { font: 700 1.05rem var(--mono); }
  .row .ag { font: 500 .9rem var(--mono); color: var(--muted); }
  .row.unranked .bt, .row.unranked .rk { color: var(--dim); }
  .row.running, .pod.running { outline: 1.5px solid var(--live); background: var(--live-soft); }
  .tag { display: inline-block; vertical-align: middle; margin-left: 10px; font: 700 .58rem var(--body); letter-spacing: .14em; padding: 2px 6px; border-radius: 4px; }
  .tag.ready   { color: var(--text); border: 1px solid rgba(255,255,255,.35); }
  .tag.running { color: var(--live); border: 1px solid rgba(61,214,198,.5); animation: pulse 1.4s infinite; }
  .tag.stopped { color: var(--gold); border: 1px solid rgba(245,196,81,.5); }
  .tag.done    { color: var(--ok); border: 1px solid rgba(74,222,128,.5); }
  .tag.next { color: var(--warn); border: 1px solid rgba(251,191,36,.5); }
  .row.next, .pod.next { outline: 1px dashed rgba(251,191,36,.55); }
  .nextchip { background: rgba(0,0,0,.6); color: var(--warn); border-color: rgba(251,191,36,.45); text-transform: none; letter-spacing: .04em; font-size: .8rem; }
  .nextchip b { font-family: var(--display); color: var(--text); font-weight: 600; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line-2); }
  .dots i.ok { background: var(--live); }
  .dots i.dnf { background: var(--accent); }
  .dots i.odo-dot { background: var(--gold); }
  .empty-msg { color: var(--dim); text-align: center; padding: 30px; font-size: .9rem; }

  /* ---------- stage ---------- */
  .stage { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 14px; min-height: 0; }
  .inperson { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(229,72,77,.16), rgba(229,72,77,.04)); border: 1px solid rgba(229,72,77,.35); }
  .inperson svg { flex: none; color: var(--accent); }
  .inperson span { font: 600 .95rem var(--display); line-height: 1.3; }
  .cam { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #05070a; }
  .cam video, .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .cam-ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim);
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 12px, transparent 12px 24px); }
  .cam-ph p { margin: 8px 0 14px; font-size: .85rem; }
  /* stream schedule (shown in the video box outside live sessions) */
  .cam-ph.sched-on { place-items: start center; padding: 6% 6% 96px; overflow: hidden; }
  .sched { width: 100%; max-width: 620px; text-align: left; color: var(--text); }
  .sched .upper { color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .srow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 11px 14px; margin-bottom: 8px;
    border: 1px solid var(--line-2); border-radius: 12px; background: rgba(5,7,10,.6); }
  .srow .badge { font: 700 .7rem var(--mono); letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); }
  .srow b { display: block; font: 600 1.02rem var(--display); }
  .srow small { display: block; color: var(--dim); font-size: .76rem; margin-top: 2px; }
  .srow .st { font: 600 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: right; }
  .srow.next { border-color: rgba(61,214,198,.55); background: rgba(61,214,198,.07); }
  .srow.next .badge { color: var(--live); border-color: rgba(61,214,198,.5); }
  .srow.next .st { color: var(--live); }
  .srow.live { border-color: rgba(229,72,77,.6); background: rgba(229,72,77,.1); }
  .srow.live .st { color: var(--accent); }
  .srow.past { opacity: .45; }
  .srow.past b { text-decoration: line-through; }
  .sched .tzn { font-size: .72rem; color: var(--dim); margin: 4px 0 0; }
  .sched .ended { font: 600 1.1rem var(--display); margin: 0 0 12px; }
  @media (max-width: 640px) {
    .cam-ph.sched-on { padding: 10px 10px 62px; }
    .srow { padding: 5px 8px; gap: 8px; margin-bottom: 5px; border-radius: 9px; } .srow b { font-size: .8rem; }
    .srow .badge { font-size: .6rem; padding: 3px 5px; } .srow .st { font-size: .6rem; }
    .srow small, .sched .tzn { display: none; }
    .sched .upper { margin-bottom: 6px; font-size: .62rem; }
  }
  .cam-ov { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
  .cam-ov .tl { display: flex; gap: 8px; }
  .cam-bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
    background: linear-gradient(0deg, rgba(0,0,0,.78), rgba(0,0,0,0)); margin: 0 -16px -16px; padding: 40px 18px 14px; }
  .cam-team { font: 700 1.5rem var(--display); text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .cam-team small { display: block; font: 600 .68rem var(--body); letter-spacing: .16em; color: var(--live); text-transform: uppercase; margin-bottom: 2px; }
  .timer { font: 700 3.1rem var(--mono); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  .timer.running { color: var(--live); }
  .timer.stopped { color: var(--gold); animation: flash .5s 3; }
  .timer.idle { color: rgba(255,255,255,.55); }
  .timer.done { color: var(--ok); }
  @keyframes flash { 50% { opacity: .3 } }
  .rec { color: #fff; background: var(--accent); }
  .rec .dot { animation: pulse 1.2s infinite; }
  .cam-picker { position: absolute; top: 12px; right: 12px; width: auto; max-width: 240px; font-size: .75rem; padding: 6px 30px 6px 10px; opacity: 0; transition: opacity .2s; pointer-events: auto; background-color: rgba(0,0,0,.65); }
  .cam:hover .cam-picker { opacity: 1; }

  .card { padding: 20px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-head .pill.live { animation: none; }
  .card-head .pill.donepill { color: var(--ok); border-color: rgba(74,222,128,.45); background: rgba(74,222,128,.08); }
  .card-head .pill.nextpill { color: var(--warn); border-color: rgba(251,191,36,.45); background: rgba(251,191,36,.08); }
  .progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; width: 90px; }
  .progress i { display: block; height: 100%; background: var(--muted); width: 0; }
  .card-body { flex: 1; min-height: 0; overflow: hidden; animation: fadeIn .45s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } }

  #howCard .how-intro { font-size: .9rem; margin-bottom: 12px; }
  #howCard .how-steps { gap: 8px; }
  #howCard .how-steps li { grid-template-columns: 34px 1fr; }
  #howCard .how-steps li::before { height: 28px; font-size: .8rem; }
  #howCard .how-steps b { font-size: .95rem; }
  #howCard .how-steps p { font-size: .84rem; line-height: 1.35; }
  #howCard .how-gloss { margin-top: 10px; padding-top: 10px; }

  /* ---------- ticker ---------- */
  .disclaimer { padding: 6px 28px 8px; font-size: .72rem; color: var(--dim); background: rgba(7,9,13,.9); text-align: center; }
  .ticker { display: flex; align-items: center; gap: 16px; padding: 10px 28px; border-top: 1px solid var(--line); background: rgba(7,9,13,.9); overflow: hidden; white-space: nowrap; }
  .ticker .upper { color: var(--accent); }
  #ticker { display: flex; gap: 28px; font: 500 .85rem var(--mono); color: var(--muted); overflow: hidden; }
  #ticker b { color: var(--text); font-family: var(--display); font-weight: 600; margin-right: 8px; }
  #ticker .dnf { color: var(--accent); }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(3,5,8,.72); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; padding: 20px; }
  .modal.open { display: grid; }
  .modal-box { width: min(860px, 100%); max-height: 90vh; overflow: auto; padding: 26px; position: relative; }
  .modal-box h2 { margin: 0 0 14px; font: 700 1.4rem var(--display); text-transform: uppercase; letter-spacing: .04em; }
  .modal-close { position: absolute; top: 16px; right: 16px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  .banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.8); z-index: 95; pointer-events: none;
    font: 700 3.2rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--gold);
    text-shadow: 0 0 40px rgba(245,196,81,.5), 0 4px 20px rgba(0,0,0,.8); opacity: 0; text-align: center;
    background: rgba(5,7,10,.88); border: 1px solid rgba(245,196,81,.45); border-radius: 18px; padding: 22px 48px; white-space: nowrap; }
  .banner small { display: block; font-size: 1.2rem; color: var(--text); letter-spacing: .12em; }
  .banner.show { animation: bannerIn 3.2s ease forwards; }
  @keyframes bannerIn { 10% { opacity: 1; transform: translate(-50%,-50%) scale(1) } 80% { opacity: 1; transform: translate(-50%,-50%) scale(1) } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05) } }

  /* ---------- responsive ---------- */
  /* desktop: the page scrolls naturally instead of squeezing everything into one screen */
  @media (min-width: 1051px) {
    body { display: block; overflow: auto; }
    .stage { grid-template-rows: auto auto auto; }
    .card { min-height: 460px; }
    .rows { overflow: visible; }
  }
  @media (max-width: 1050px) {
    body { overflow: auto; display: block; }
    .grid { grid-template-columns: 1fr; }
    .stage { grid-template-rows: auto auto auto; }
    .rows { max-height: none; overflow: visible; }
    .top { flex-wrap: wrap; padding: 14px 16px; }
    .grid { padding: 14px 16px; }
    .ticker { padding: 10px 16px; }
    .disclaimer { padding: 8px 16px 12px; white-space: normal; }
  }
  .pod { min-width: 0; }
  #ticker { min-width: 0; }
  @media (max-width: 640px) {
    html, body { overflow-x: hidden; }
    .podium .pod.r1 { padding-top: 14px; }
    .thead, .row { grid-template-columns: 34px 36px minmax(0, 1fr) 80px; }
    .thead .hide-s, .row .hide-s { display: none; }
    .row.running::after { display: none; }
    .podium { gap: 8px; } .pod { padding: 10px; } .pod .tm { font-size: 1.1rem !important; } .pod .ec, .pod .sub { display: none; }
    .timer { font-size: 2.2rem; } .cam-team { font-size: 1.1rem; }
    .brand-title { font-size: 1.15rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logos" id="logos" hidden></div>
    <div class="brand-mark" id="course">ECE 3610</div>
    <div><div class="brand-title" id="title">Final Course Trials</div><div class="brand-sub" id="subtitle"></div></div>
  </div>
  <div class="top-right">
    <span class="pill" id="status"><span class="dot"></span><span>Connecting</span></span>
    <button class="btn sm ghost lang-btn" id="langBtn" type="button"></button>
    <button class="btn sm ghost" id="howBtn">How it works</button>
    <a class="btn sm live" id="liveLink" target="_blank" rel="noopener" hidden>● Watch live</a>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<main class="grid">
  <section class="board panel">
    <div class="sec-head">
      <h2 id="lbTitle">Leaderboard</h2>
      <div class="note" id="lbNote"></div>
    </div>
    <div class="podium" id="podium"></div>
    <div class="thead"><span>#</span><span></span><span data-i18n="thTeam">Team</span><span class="hide-s" data-i18n="thRuns">Runs</span><span class="r" data-i18n="thBest">Best</span><span class="r hide-s" data-i18n="thAvg">Avg</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="stage">
    <div class="cam panel" id="cam">
      <div class="cam-ph" id="camPh">
        <div>
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
          <p id="camMsg" data-i18n="camOffline">Camera offline</p>
          <button class="btn sm" id="camBtn" data-i18n="enableCam" hidden>Enable camera</button>
        </div>
      </div>
      <div class="cam-ov">
        <div class="tl"><span class="pill rec" id="recPill" hidden><span class="dot"></span>Live</span><span class="pill nextchip" id="nextChip" hidden></span></div>
        <div class="cam-bot">
          <div class="cam-team" id="camTeam"><small>Standby</small>Waiting for next team</div>
          <div class="timer mono idle" id="timer">0:00.00</div>
        </div>
      </div>
      <select class="cam-picker" id="camPicker" hidden></select>
    </div>

    <div class="inperson" id="inPerson" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="inPersonText"></span>
    </div>

    <div class="card panel">
      <div class="card-head">
        <span class="pill" id="cardLabel">Spotlight</span>
        <div class="progress"><i id="cardProg"></i></div>
      </div>
      <div class="card-body" id="cardBody"></div>
    </div>
  </section>
</main>

<footer class="ticker"><span class="upper" data-i18n="latestRuns">Latest runs</span><div id="ticker"><span>No runs yet</span></div></footer>
<p class="disclaimer" id="disclaimer"></p>

<div class="modal" id="modal"><div class="modal-box panel"><button class="btn sm ghost modal-close" id="modalClose">✕</button><div id="modalBody"></div></div></div>
<div class="toast-wrap" id="toasts"></div>
<div class="banner" id="banner"></div>
<canvas id="confetti"></canvas>

<script src="assets/config.js?v=202611241829"></script>
<script src="assets/i18n.js?v=202611241829"></script>
<script src="assets/api.js?v=202611241829"></script>
<script src="assets/how.js?v=202611241829"></script>
<script src="assets/teamcard.js?v=202611241829"></script>
<script>
const { CFG, DEMO, esc, fmtTime, initials, hue, standings, getData, store, completed } = Trials;
const odoMark = r => r && r.status === "ODO" ? ` <span class="odo">★</span>` : "";   // completed with odometry
const $ = id => document.getElementById(id);

Trials.renderLogos($("logos"));
$("course").textContent = CFG.COURSE;
// Language-dependent fixed text (re-run when the viewer switches language)
function applyLang() {
  const L = I18N.lang;
  $("title").textContent = I18N.cfg(CFG, "TITLE");
  $("subtitle").textContent = I18N.cfg(CFG, "SUBTITLE");
  document.title = `${CFG.COURSE} · ${I18N.cfg(CFG, "TITLE")}`;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = I18N.t(el.dataset.i18n));
  $("lbTitle").textContent = I18N.t("leaderboard");
  $("lbNote").innerHTML = `${esc(I18N.t("rankedBy"))} · <b>${esc(I18N.t("topEC", { n: CFG.EXTRA_CREDIT_SPOTS }))}</b>`;
  $("howBtn").textContent = I18N.t("how");
  $("langBtn").textContent = I18N.t("langBtn"); $("langBtn").title = I18N.t("langTitle");
  $("langBtn").lang = L === "ko" ? "en" : "ko";
  $("inPersonText").textContent = I18N.cfg(CFG, "IN_PERSON_MESSAGE") || "";
  showInPerson();
  const disc = I18N.cfg(CFG, "CONSENT_DISCLAIMER") || "";
  $("disclaimer").textContent = disc; $("disclaimer").hidden = !disc;
  if (!CFG.LIVE_LINK) $("liveLink").textContent = I18N.t("openYT");
  setStatus(statusKind);
}
// In-person banner: shown while there is something to come and watch (hidden after the last session).
function showInPerson() {
  const msg = I18N.cfg(CFG, "IN_PERSON_MESSAGE");
  const sched = (CFG.STREAM_SCHEDULE || []).map(x => Date.parse(x.end)).filter(isFinite);
  const over = sched.length && Date.now() > Math.max(...sched) + (CFG.STREAM_TAIL_MIN ?? 30) * 60e3;
  $("inPerson").hidden = !msg || over;
}
setInterval(showInPerson, 60e3);
let statusKind = "connecting";
$("langBtn").onclick = () => {
  I18N.set(I18N.lang === "ko" ? "en" : "ko");
  applyLang();
  closeModal();
  if (data) { render(); cardKey = ""; renderCard(true); }
  streamText();
};
applyLang();
function setStatus(kind) {
  statusKind = kind;
  const cls = { live: "live", demo: "demo", reconnecting: "err" }[kind] || "";
  $("status").className = "pill " + cls;
  $("status").innerHTML = `<span class="dot"></span><span>${esc(I18N.t(kind))}</span>`;
}


const params = new URLSearchParams(location.search);
const CAM_MODE = params.get("cam") || CFG.CAMERA_MODE;
// Stream delay: ?delay=ms overrides config; no delay when showing a local webcam.
const DELAY = params.has("delay") ? Number(params.get("delay")) || 0
            : CAM_MODE === "local" || CAM_MODE === "none" ? 0 : Number(CFG.STREAM_DELAY_MS) || 0;



let data = null, list = [], sig = "", offset = 0, seen = null, leaderId = null;

// ---------------------------------------------------------------- helpers
function avatar(t, cls, extra = "") {
  const h = hue(t.team);
  const bg = t.photo ? `background-image:url('${esc(t.photo)}')` : `background:linear-gradient(135deg,hsl(${h},45%,30%),hsl(${(h+50)%360},50%,14%))`;
  return `<div class="avatar ${cls}" style="${bg};${extra}">${t.photo ? "" : esc(initials(t.team))}</div>`;
}
const medal = r => r <= 3 ? I18N.t("medal" + r) : I18N.t("medalN", { n: r });
const runDots = t => {
  const n = Math.max(CFG.RUNS_PER_TEAM, t.runs.length);
  return `<div class="dots">${Array.from({ length: n }, (_, i) => {
    const r = t.runs[i]; return `<i class="${r ? (r.status === "ODO" ? "odo-dot" : completed(r) ? "ok" : "dnf") : ""}"></i>`; }).join("")}</div>`;
};


// ---------------------------------------------------------------- render
function render() {
  const cur = (data.state.currentTeam || "").toLowerCase();
  const nxt = (data.state.nextTeam || "").toLowerCase();
  const flag = t => { const k = t.team.toLowerCase(); return k === cur ? "running" : k === nxt ? "next" : ""; };
  const tag = t => {
    const f = flag(t); if (!f) return "";
    if (f === "next") return `<span class="tag next">${I18N.t("tagNext")}</span>`;
    const g = stageInfo(); return g ? `<span class="tag ${g.key}">${g.tag}</span>` : "";
  };
  const ranked = list.filter(t => t.rank != null);

  // podium (display order 2,1,3)
  $("podium").innerHTML = [2, 1, 3].map(r => {
    const t = ranked[r - 1];
    if (!t) return `<div class="pod r${r} empty"><span class="medal">${medal(r)}</span><div class="avatar ph" style="background:rgba(255,255,255,.03)"></div><div class="nm muted">${I18N.t("openSpot")}</div><div class="tm">—</div></div>`;
    return `<div class="pod r${r} ${flag(t)}" data-team="${esc(t.team)}">
      <span class="medal">${medal(r)}</span>${t.ec ? `<span class="ec">${I18N.t("ec")}</span>` : ""}
      ${avatar(t, "ph")}
      <div class="nm">${esc(t.team)}${tag(t)}</div><div class="rb">${esc(t.robot || " ")}</div>
      <div class="tm mono">${fmtTime(t.best)}</div>
      <div class="sub"><span>${I18N.t("avgX", { t: fmtTime(t.avg) })}</span><span>${I18N.t("runsX", { n: t.runs.length, m: CFG.RUNS_PER_TEAM })}</span></div>
    </div>`;
  }).join("");

  // table (rank 4+, then unranked)
  const rest = list.filter(t => !(t.rank && t.rank <= 3));
  const before = {};
  $("rows").querySelectorAll(".row").forEach(el => before[el.dataset.team] = el.getBoundingClientRect().top);
  $("rows").innerHTML = rest.length ? rest.map(t => `
    <div class="row ${t.rank == null ? "unranked" : ""} ${flag(t)}" data-team="${esc(t.team)}">
      <span class="rk">${t.rank ?? "–"}</span>
      ${avatar(t, "av")}
      <div class="nm">${esc(t.team)}${tag(t)}<small>${esc(t.robot || (t.runs.length ? "" : I18N.t("awaitingFirst")))}</small></div>
      <span class="hide-s">${runDots(t)}</span>
      <span class="bt r">${fmtTime(t.best)}</span>
      <span class="ag r hide-s">${fmtTime(t.avg)}</span>
    </div>`).join("")
    : (list.length ? "" : `<div class="empty-msg">${I18N.t("noTeams")}</div>`);
  // FLIP animate rank changes
  $("rows").querySelectorAll(".row").forEach(el => {
    const b = before[el.dataset.team]; if (b == null) return;
    const d = b - el.getBoundingClientRect().top;
    if (Math.abs(d) > 2) el.animate([{ transform: `translateY(${d}px)` }, { transform: "none" }], { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)" });
  });

  // ticker
  const latest = [...data.runs].sort((a, b) => String(b.ts).localeCompare(String(a.ts))).slice(0, 8);
  $("ticker").innerHTML = latest.length ? latest.map(r => {
    const t = list.find(x => x.team.toLowerCase() === String(r.team).toLowerCase());
    const n = t ? t.runs.find(x => x.id === r.id)?.n : "";
    return `<span><b>${esc(r.team)}</b>${I18N.t("runN", { n })} · <span class="${completed(r) ? "" : "dnf"}">${completed(r) ? fmtTime(r.time) + odoMark(r) : esc(r.status)}</span></span>`;
  }).join("") : `<span>${I18N.t("noRuns")}</span>`;

  renderStageInfo();
  renderCard(true);
}

// ---------------------------------------------------------------- stage / timer
function curTeam() {
  const c = (data?.state.currentTeam || "").toLowerCase();
  return c ? list.find(t => t.team.toLowerCase() === c) || { team: data.state.currentTeam, runs: [] } : null;
}
function nextTeam() {
  const n = (data?.state.nextTeam || "").toLowerCase();
  return n ? list.find(t => t.team.toLowerCase() === n) || { team: data.state.nextTeam, runs: [] } : null;
}

// Stage of the team on course: ready -> running -> stopped -> done ("Run complete")
function stageInfo() {
  const t = curTeam(); if (!t || !data) return null;
  const st = data.state, R = CFG.RUNS_PER_TEAM;
  if (st.timerState === "done") {
    const r = (t.runs || []).find(x => x.id === st.lastRunId) || (t.runs || [])[t.runs.length - 1];
    if (r && !completed(r)) return { key: "done", tag: I18N.t("tagDoneStatus", { n: r.n, s: r.status }), label: I18N.t("lblDoneStatus", { n: r.n, s: r.status }), detail: "", run: r };
    return { key: "done", tag: I18N.t("tagDone"), label: r ? I18N.t("lblDone", { n: r.n }) : I18N.t("lblDoneAny"),
      detail: r ? fmtTime(r.time) + (r.status === "ODO" ? " · ★ " + I18N.t("odo") : "") : "", run: r };
  }
  const n = (t.runs || []).length + 1, d = I18N.t("runOf", { n, m: R });
  if (st.timerState === "running") return { key: "running", tag: I18N.t("tagRunning"), label: I18N.t("lblRunning"), detail: d };
  if (st.timerState === "stopped") return { key: "stopped", tag: I18N.t("tagStopped"), label: I18N.t("lblStopped"), detail: d };
  return { key: "ready", tag: I18N.t("tagReady"), label: I18N.t("lblReady"), detail: d };
}

function renderStageInfo() {
  const t = curTeam(), st = data.state;
  const chip = $("nextChip");
  chip.hidden = !(st.nextTeam && t);
  chip.innerHTML = `${I18N.t("upNext")}&nbsp;<b>${esc(st.nextTeam || "")}</b>`;
  if (!t) {
    $("camTeam").innerHTML = st.nextTeam ? `<small style="color:var(--warn)">${I18N.t("upNext")}</small>${esc(st.nextTeam)}` : `<small>${I18N.t("standby")}</small>${I18N.t("waiting")}`;
    return;
  }
  const g = stageInfo();
  const color = { ready: "var(--text)", running: "var(--live)", stopped: "var(--gold)", done: "var(--ok)" }[g.key];
  $("camTeam").innerHTML = `<small style="color:${color}">${g.label}${g.detail ? " · " + g.detail : ""}</small>${esc(t.team)}`;
}

function tick() {
  if (data) {
    const st = data.state, el = $("timer");
    let ms = 0, mode = "idle";
    if (st.timerState === "running") { ms = Date.now() + offset - DELAY - st.timerStartMs; mode = "running"; }
    else if (st.timerState === "stopped") { ms = st.timerElapsedMs; mode = "stopped"; }
    let txt = null;
    if (st.timerState === "done" && st.currentTeam) {      // show the official, saved result
      const r = stageInfo()?.run; mode = "done";
      if (r && !completed(r)) txt = r.status; else ms = r ? r.time * 1000 : 0;
    }
    txt = txt ?? fmtTime(Math.max(0, ms) / 1000);
    if (el.textContent !== txt) el.textContent = txt;
    if (!el.classList.contains(mode)) el.className = "timer mono " + mode;
  }
  $("clock").textContent = new Date().toLocaleTimeString("en-GB", { hour12: false });   // 24-h HH:MM:SS in every language
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- spotlight card
let rot = 0, rotStart = Date.now(), cardKey = "";
function rotationItems() {
  const items = [{ kind: "how" }];
  list.filter(t => TEXT_FIELDS.some(k => t[k]) || t.photo || t.runs.length).forEach(t => items.push({ kind: "team", team: t.team }));
  return items;
}
function renderCard(fromData) {
  const cur = curTeam(), nxt = nextTeam();
  let item, label, cls = "pill";
  if (cur) {
    const g = stageInfo();
    item = { kind: "team", team: cur.team };
    label = g.key === "done" ? g.label + (g.detail ? " · " + g.detail : "") : g.label;
    cls = g.key === "done" ? "pill donepill" : "pill live";
  }
  else if (nxt) { item = { kind: "team", team: nxt.team }; label = I18N.t("upNext"); cls = "pill nextpill"; }
  else {
    const items = rotationItems();
    if (Date.now() - rotStart > CFG.SPOTLIGHT_MS) { rot++; rotStart = Date.now(); }
    item = items[rot % items.length];
    label = item.kind === "how" ? I18N.t("how") : I18N.t("spotlight");
  }
  const key = I18N.lang + "|" + label + "|" + (item.team || "how");
  if (key === cardKey && !fromData) return;
  const body = $("cardBody");
  const html = item.kind === "how" ? `<div id="howCard"></div>` : teamCard(list.find(t => t.team === item.team) || cur || nxt);
  if (key !== cardKey) { body.style.animation = "none"; body.offsetHeight; body.style.animation = ""; }
  body.innerHTML = html;
  if (item.kind === "team") { body.dataset.team = item.team; body.style.cursor = "pointer"; body.title = I18N.t("clickCard"); }
  else { delete body.dataset.team; body.style.cursor = ""; body.title = ""; }
  if (item.kind === "how") renderHowItWorks($("howCard"), { compact: true });
  $("cardLabel").className = cls;
  $("cardLabel").innerHTML = (cur || nxt ? `<span class="dot"></span>` : "") + label;
  cardKey = key;
}
setInterval(() => {
  const p = curTeam() || nextTeam() ? 0 : Math.min(1, (Date.now() - rotStart) / CFG.SPOTLIGHT_MS);
  $("cardProg").style.width = (p * 100) + "%";
  if (data && !curTeam() && !nextTeam()) renderCard(false);
}, 200);

// ---------------------------------------------------------------- events
function toast(html, err) {
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.innerHTML = html;
  $("toasts").appendChild(el); setTimeout(() => el.remove(), 6000);
}
function banner(main, sub) {
  const b = $("banner"); b.innerHTML = `${esc(main)}<small>${esc(sub)}</small>`;
  b.classList.remove("show"); b.offsetWidth; b.classList.add("show");
}

function detectEvents(prevList) {
  const ids = new Set(data.runs.map(r => r.id));
  if (seen) {
    data.runs.filter(r => !seen.has(r.id)).forEach(r => {
      const t = list.find(x => x.team.toLowerCase() === String(r.team).toLowerCase());
      const n = t?.runs.find(x => x.id === r.id)?.n ?? "";
      if (!completed(r)) { toast(`<b>${esc(r.team)}</b> · ${I18N.t("runN", { n })} · <span style="color:var(--accent)">${esc(r.status)}</span>`); return; }
      const prev = prevList.find(x => x.team === t?.team);
      toast(`<b>${esc(r.team)}</b> · ${I18N.t("runN", { n })} · <span class="mono">${fmtTime(r.time)}</span>${r.status === "ODO" ? ` <span class="odo">★ ${I18N.t("odo")}</span>` : ""}`);
      if (t && t.best === r.time) {
        const newLeader = list[0]?.team === t.team && leaderId !== t.team;
        if (newLeader) { banner(I18N.t("newLeader"), `${t.team} · ${fmtTime(r.time)}`); confetti(); }
        else if (t.ec && !(prev && prev.ec)) { banner(I18N.t("podium"), I18N.t("movesTo", { team: t.team, r: t.rank })); confetti(.4); }
      }
    });
  }
  seen = ids;
  leaderId = list[0]?.best != null ? list[0].team : null;
}

// ---------------------------------------------------------------- polling
// Each snapshot is tagged with the real (server) time of its newest event and
// shown STREAM_DELAY ms after that, so the page stays in step with the video.
const queue = [];
let queuedSig = "";
// Real (server-clock) time of the newest timing event in a snapshot. Run timestamps are
// deliberately ignored: Sheets can shift them by a time-zone offset. Never later than the
// moment the snapshot was read, so an odd value can't hold the page back.
function eventTime(d) {
  const t = Number(d.state.updatedMs) || 0;
  return d.serverNow ? Math.min(t, d.serverNow) : t;
}
function apply(d) {
  const s = JSON.stringify([d.teams, d.runs, d.state]);
  if (s === sig) return;
  sig = s; const prevList = list;
  data = d; list = standings(d);
  detectEvents(prevList);
  render();
}
function drainQueue() {
  const shownNow = Date.now() + offset - DELAY;
  let pick = null;
  // Safety net: nothing waits longer than the stream delay + 3 s after it arrived.
  while (queue.length && (queue[0].at <= shownNow || Date.now() - queue[0].recv > DELAY + 3000)) pick = queue.shift();
  if (pick) apply(pick.d);
}
setInterval(drainQueue, 50);

async function poll() {
  try {
    const d = await getData();
    offset = d._offset || 0;
    setStatus(DEMO ? "demo" : "live");
    const s = JSON.stringify([d.teams, d.runs, d.state]);
    if (!data) { apply(d); queuedSig = s; }                 // first load: show immediately
    else if (s !== queuedSig) {
      queuedSig = s;
      const last = queue.length ? queue[queue.length - 1].at : 0;
      queue.push({ d, at: Math.max(eventTime(d), last), recv: Date.now() });  // keep order
      drainQueue();
    }
  } catch (e) {
    console.error(e);
    setStatus("reconnecting");
  }
}
// Poll faster while a team is on course so the finish lands on time.
(function loop() {
  const latest = queue.length ? queue[queue.length - 1].d : data;
  const busy = latest && latest.state.currentTeam;
  poll().finally(() => setTimeout(loop, busy ? CFG.POLL_FAST_MS || 1500 : CFG.POLL_MS));
})();
// demo mode: react instantly to admin tab in the same browser
window.addEventListener("storage", () => DEMO && poll());
tick();

// ---------------------------------------------------------------- modal
function openModal(html, after) { $("modalBody").innerHTML = html; after && after(); $("modal").classList.add("open"); }
// Closing empties the popup, which unloads any video player so its audio stops.
function closeModal() { $("modal").classList.remove("open"); $("modalBody").innerHTML = ""; }
$("modalClose").onclick = closeModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("howBtn").onclick = () => openModal(`<h2>${esc(I18N.t("how"))}</h2><div id="howModal"></div>`, () => renderHowItWorks($("howModal")));
// Training video player (Google Drive preview) inside the popup
function openVideo(fileId, team) {
  const t = list.find(x => x.team === team), vs = (t && t.videos) || [];
  const n = vs.findIndex(v => v.fileId === fileId) + 1;
  const player = fileId.startsWith("demo-") ? `<div class="vdemo">Demo video (plays from Google Drive on the live site)</div>`
    : `<iframe src="https://drive.google.com/file/d/${encodeURIComponent(fileId)}/preview" allow="autoplay; fullscreen" allowfullscreen title="${esc(team)}"></iframe>`;
  openModal(`<h2>${esc(team)} · ${esc(I18N.t("videoN", { n: n || 1 }))}</h2><div class="vplayer">${player}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn sm" type="button" data-backcard="${esc(team)}">${esc(I18N.t("backToCard"))}</button>
      ${vs.map((v, i) => `<button class="vbtn" type="button" data-video="${esc(v.fileId)}" data-vteam="${esc(team)}" ${v.fileId === fileId ? 'style="opacity:.5"' : ""}>▶ ${esc(I18N.t("videoN", { n: i + 1 }))}</button>`).join("")}
    </div>`);
}
document.addEventListener("click", e => {
  const vb = e.target.closest("[data-video]");
  if (vb) { e.stopPropagation(); openVideo(vb.dataset.video, vb.dataset.vteam); return; }
  const bc = e.target.closest("[data-backcard]");
  if (bc) { const t = list.find(x => x.team === bc.dataset.backcard); if (t) openModal(teamCard(t, { full: true })); return; }
  const el = e.target.closest("[data-team]"); if (!el) return;
  const t = list.find(x => x.team === el.dataset.team); if (t) openModal(teamCard(t, { full: true }));
});

// ---------------------------------------------------------------- camera
const video = document.createElement("video");
video.autoplay = true; video.muted = true; video.playsInline = true;
let stream = null;
async function startCam(deviceId) {
  try {
    stream?.getTracks().forEach(t => t.stop());
    const v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    if (deviceId) v.deviceId = { exact: deviceId };
    stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
    video.srcObject = stream;
    if (!video.isConnected) $("cam").prepend(video);
    $("camPh").hidden = true; $("recPill").hidden = false;
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const active = stream.getVideoTracks()[0]?.getSettings().deviceId;
    if (devs.length > 1) {
      $("camPicker").innerHTML = devs.map((d, i) => `<option value="${d.deviceId}" ${d.deviceId === active ? "selected" : ""}>${esc(d.label || I18N.t("camera", { n: i + 1 }))}</option>`).join("");
      $("camPicker").hidden = false;
    }
    if (active) store.set("ece3610_cam", active);
  } catch (e) {
    console.warn("Camera:", e);
    $("camMsg").textContent = e.name === "NotAllowedError" ? I18N.t("camBlocked") : I18N.t("noCam");
    $("camBtn").hidden = false;
  }
}
$("camBtn").onclick = () => startCam();
$("camPicker").onchange = e => startCam(e.target.value);

// ---------------------------------------------------------------- live stream + schedule
const SCHED = (CFG.STREAM_SCHEDULE || []).map((x, i) => ({ ...x, s: Date.parse(x.start), e: Date.parse(x.end), i }))
  .filter(x => isFinite(x.s) && isFinite(x.e)).sort((a, b) => a.s - b.s);
const LEAD = (CFG.STREAM_LEAD_MIN ?? 15) * 60e3, TAIL = (CFG.STREAM_TAIL_MIN ?? 30) * 60e3;
const ytSrc = id => `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1`;
const ytWatch = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;

// What the video box should show right now.
function streamPlan(now = Date.now()) {
  const idOf = x => (x && x.youtubeId) || CFG.YOUTUBE_ID || "";
  if (CAM_MODE === "embed") return CFG.EMBED_URL ? { mode: "embed", src: CFG.EMBED_URL } : { mode: "schedule" };
  // Test stream: index.html?yt=VIDEO_ID shows that stream now (use a separate test stream, not the scheduled ones).
  const testId = params.get("yt");
  if (testId && /^[\w-]{6,20}$/.test(testId)) return { mode: "embed", src: ytSrc(testId), id: testId, live: true };
  if (!SCHED.length) return CFG.YOUTUBE_ID ? { mode: "embed", src: ytSrc(CFG.YOUTUBE_ID), id: CFG.YOUTUBE_ID } : { mode: "msg", text: "startsSoon" };
  const active = SCHED.find(x => now >= x.s - LEAD && now <= x.e + TAIL);
  const forced = params.get("live") === "1" ? (active || SCHED.find(x => now < x.e) || SCHED[SCHED.length - 1]) : null;
  const sess = active || forced;
  if (sess) return idOf(sess) ? { mode: "embed", src: ytSrc(idOf(sess)), id: idOf(sess), live: true } : { mode: "schedule" };
  const last = SCHED[SCHED.length - 1];
  if (now > last.e + TAIL) return idOf(last) ? { mode: "embed", src: ytSrc(idOf(last)), id: idOf(last), replay: true } : { mode: "ended" };
  return { mode: "schedule" };
}

// Dates/times in the viewer's own time zone (plus Korea time for reference).
const VIEWER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
const IN_KOREA = new Date().getTimezoneOffset() === -540;
const dayF  = tz => new Intl.DateTimeFormat(I18N.locale, { weekday: "short", month: "short", day: "numeric", ...(tz && { timeZone: tz }) });
const timeF = tz => new Intl.DateTimeFormat(I18N.locale, { hour: "numeric", minute: "2-digit", ...(tz && { timeZone: tz }) });
const tzName = (t, tz) => new Intl.DateTimeFormat(I18N.locale, { timeZoneName: "short", ...(tz && { timeZone: tz }) })
  .formatToParts(t).find(p => p.type === "timeZoneName")?.value || "";
function rangeText(x, tz, tzLabel) {
  const d1 = dayF(tz).format(x.s), d2 = dayF(tz).format(x.e), t = timeF(tz);
  const zone = tzLabel ?? (IN_KOREA && !tz ? "KST" : tzName(x.s, tz));
  return d1 === d2 ? `${d1} · ${t.format(x.s)} – ${t.format(x.e)} ${zone}` : `${d1} ${t.format(x.s)} – ${d2} ${t.format(x.e)} ${zone}`;
}
const untilText = ms => I18N.until(ms);
function scheduleHTML(now = Date.now()) {
  const next = SCHED.find(x => now < x.e);
  const rows = SCHED.map(x => {
    const state = now > x.e ? "past" : now >= x.s ? "live" : x === next ? "next" : "";
    const st = state === "past" ? I18N.t("ended") : state === "live" ? I18N.t("liveNow") : state === "next" ? untilText(x.s - now) : "";
    return `<div class="srow ${state}"><span class="badge">${esc(I18N.cfg(x, "label") || I18N.t("session", { n: x.i + 1 }))}</span>
      <div><b>${rangeText(x)}</b>${IN_KOREA ? "" : `<small>${I18N.t("koreaTime")}: ${rangeText(x, "Asia/Seoul", "KST")}</small>`}</div>
      <span class="st">${st}</span></div>`;
  }).join("");
  return `<div class="sched"><div class="upper">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
      ${I18N.t("schedTitle")}</div>${rows}
    <p class="tzn">${I18N.t("tzNote", { tz: VIEWER_TZ ? ` (${esc(VIEWER_TZ.replace(/_/g, " "))})` : "" })}</p></div>`;
}

let streamKey = "", lastPlan = null;
function applyStream() {
  if (CAM_MODE === "local" || CAM_MODE === "none") return;
  const plan = streamPlan(), key = plan.mode + "|" + (plan.src || "");
  const ph = $("camPh");
  if (key !== streamKey) {                       // switch between video and placeholder
    streamKey = key;
    $("cam").querySelector("iframe")?.remove();
    ph.classList.toggle("sched-on", plan.mode === "schedule" || plan.mode === "ended");
    if (plan.mode === "embed") {
      const f = document.createElement("iframe");
      f.src = plan.src;
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
      $("cam").prepend(f); ph.hidden = true; $("recPill").hidden = false;
    } else { ph.hidden = false; $("recPill").hidden = true; }
  }
  lastPlan = plan;
  streamText();
}
// Text inside the video box (re-run every 30 s for countdowns, and on language change).
function streamText() {
  const plan = lastPlan; if (!plan) return;
  const ph = $("camPh"), f = $("cam").querySelector("iframe");
  if (f) f.title = I18N.t("liveStream");
  if (plan.mode === "embed") $("recPill").innerHTML = plan.replay ? I18N.t("replay") : `<span class="dot"></span>${I18N.t("recLive")}`;
  if (plan.mode === "schedule") ph.innerHTML = scheduleHTML();
  if (plan.mode === "ended") ph.innerHTML = `<div class="sched"><p class="ended">${I18N.t("trialsEnded")}</p>${scheduleHTML().replace('<div class="sched">', "<div>")}</div>`;
  if (plan.mode === "msg") ph.innerHTML = `<div><p>${esc(I18N.t(plan.text))}</p></div>`;
  // "Open on YouTube" button follows the current stream
  const href = CFG.LIVE_LINK || (plan.id ? ytWatch(plan.id) : "");
  $("liveLink").hidden = !href; if (href) $("liveLink").href = href;
}

if (CAM_MODE === "local" && navigator.mediaDevices?.getUserMedia) {
  startCam(store.get("ece3610_cam"));
} else if (CAM_MODE === "none") {
  $("camMsg").textContent = I18N.t("liveTimer");
} else {
  applyStream(); setInterval(applyStream, 30e3);
}

// ---------------------------------------------------------------- confetti
function confetti(scale = 1) {
  const c = $("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#f5c451", "#e5484d", "#3dd6c6", "#ffffff", "#c3ced9"];
  const P = Array.from({ length: Math.round(220 * scale) }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .4,
    vx: (Math.random() - .5) * 18, vy: -Math.random() * 16 - 4, r: Math.random() * 6 + 3,
    a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (t - t0 < 4000) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}
